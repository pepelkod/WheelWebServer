<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Builder</title>
<meta name="description" content="Generate a 3D-printable STL of a spoked bicycle wheel from rim, hub and lacing parameters.">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #dcdad2; --accent: #b4441c; --accent-ink: #ffffff;
    --warn-bg: #fff4d6; --warn-ink: #6b4b00; --err-bg: #fde3e0; --err-ink: #8a1c10;
    --viewer: #e9e7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a988f;
      --line: #34332f; --accent: #e0683c; --accent-ink: #160b05;
      --warn-bg: #3a3014; --warn-ink: #f0d58a; --err-bg: #3d1a15; --err-ink: #f5b3a8;
      --viewer: #262622;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 20px 6px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px; padding: 12px 20px 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }

  #form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 4px 16px 16px; max-height: calc(100vh - 110px); overflow: auto; }
  @media (max-width: 820px) { #form { max-height: none; } }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 12px 0 0; padding: 10px 0 0; }
  fieldset:first-of-type { border-top: 0; }
  legend { font-weight: 650; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0; }
  .row { display: grid; grid-template-columns: 1fr 96px; gap: 4px 10px; align-items: center; margin: 10px 0; }
  .row label { font-size: 14px; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row.wide { grid-template-columns: 1fr; }
  .row.check { grid-template-columns: auto 1fr; }
  input[type=number], select { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

  #side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #viewer { position: relative; background: var(--viewer); border: 1px solid var(--line);
            border-radius: 10px; height: min(62vh, 640px); min-height: 320px; overflow: hidden; }
  #viewer canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
             color: var(--muted); padding: 20px; pointer-events: none; }
  #stale { position: absolute; top: 10px; left: 10px; background: var(--panel); border: 1px solid var(--line);
           padding: 3px 9px; border-radius: 99px; font-size: 12px; color: var(--muted); display: none; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); font-size: 14px; }

  #results { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  #results h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 18px 3px 0; text-align: left; }
  th { font-weight: 500; color: var(--muted); font-size: 13px; }
  td.num { font-weight: 600; }
  .msg { border-radius: 7px; padding: 8px 12px; margin-top: 8px; font-size: 14px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .msg.err  { background: var(--err-bg);  color: var(--err-ink); }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
</style>
<link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
<link rel="manifest" href="/favicon_io/site.webmanifest">
</head>
<body>
<header>
  <h1>Wheel Builder</h1>
  <p>Set the rim, hub and lacing, then generate a printable STL. Everything runs in your browser.</p>
</header>
<main>
  <form id="form" autocomplete="off" onsubmit="return false"></form>
  <section id="side">
    <div id="viewer">
      <div id="overlay">Press <b>&nbsp;Generate&nbsp;</b> to build the wheel.<br>The first run downloads OpenSCAD (~11&nbsp;MB).</div>
      <div id="stale">Parameters changed – regenerate</div>
    </div>
    <div class="bar">
      <button id="generate" class="primary" type="button">Generate</button>
      <button id="cancel" type="button" hidden>Cancel</button>
      <span id="downloads" class="bar"></span>
      <button id="share" type="button" title="Copy a link to this exact wheel">Copy link</button>
      <button id="reset" type="button">Reset</button>
      <span id="status"></span>
    </div>
    <div id="results" hidden></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
